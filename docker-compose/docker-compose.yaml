
services:
  mongo:
    container_name: fnote-mongo
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-fnote}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-fnote}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-fnote}
      MONGO_USERNAME: ${MONGO_USERNAME:-fnote-user}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-12345678}
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-rs0}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:-fnote-local-replica-set-key-change-me}
    volumes:
      - /fnote/data/mongo:/data/db
      - ./script/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh
      - ./script/mongo-data-init.sh:/docker-entrypoint-initdb.d/mongo-data-init.sh
      - ./script/mongo-replica-entrypoint.sh:/usr/local/bin/mongo-replica-entrypoint.sh:ro
    ports:
      - "27017:27017"
    entrypoint: ["/bin/bash", "/usr/local/bin/mongo-replica-entrypoint.sh"]
    command: ["mongod", "--auth"]
    networks:
      - fnote-network
  mongo-rs-init:
    image: mongo:latest
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-fnote}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-fnote}
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-rs0}
    depends_on:
      - mongo
    command:
      - /bin/bash
      - -c
      - |
        until mongosh --host mongo --username "$${MONGO_ROOT_USERNAME}" --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --quiet --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1; do sleep 2; done
        mongosh --host mongo --username "$${MONGO_ROOT_USERNAME}" --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --quiet --eval "try { rs.status() } catch (e) { rs.initiate({ _id: '$${MONGO_REPLICA_SET_NAME}', members: [{ _id: 0, host: 'mongo:27017' }] }) }"
        until mongosh --host mongo --username "$${MONGO_ROOT_USERNAME}" --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --quiet --eval "if (!db.hello().isWritablePrimary) { quit(1) }" >/dev/null 2>&1; do sleep 2; done
    networks:
      - fnote-network
  server:
    container_name: fnote-server
    image: fnote/fnote-server:latest
    build:
      dockerfile: Dockerfile
      context: ../server
    environment:
      WEBSITE_BASE_HOST: ${WEBSITE_BASE_HOST}
      UPLOADER_HOST: ${WEBSITE_SERVER_HOST}
      MONGODB_USERNAME: ${MONGO_USERNAME:-fnote-user}
      MONGODB_PASSWORD: ${MONGO_PASSWORD:-12345678}
      MONGODB_AUTH_SOURCE: ${MONGO_DATABASE:-fnote}
      MONGODB_DATABASE: ${MONGO_DATABASE:-fnote}
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
    ports:
      - "8080:8080"
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    volumes:
      - /fnote/data/logs:/fnote/logs
      - /fnote/data/static:/fnote/static
    networks:
      - fnote-network
  admin:
    container_name: fnote-admin
    image: fnote/fnote-admin:latest
    build:
      dockerfile: Dockerfile
      context: ../admin
      args:
        VITE_BASE_HOST: ${WEBSITE_BASE_HOST}
        VITE_API_HOST: ${WEBSITE_SERVER_HOST}
    ports:
      - "8081:80"
    depends_on:
      - server
    networks:
      - fnote-network
  web:
    container_name: fnote-web
    image: fnote/fnote-web:latest
    build:
      dockerfile: Dockerfile
      context: ../web
      args:
        SERVER_HOST: http://server:8080
        BASE_HOST: ${WEBSITE_BASE_HOST}
        ADMIN_HOST: ${WEBSITE_ADMIN_HOST}
        NEXT_PUBLIC_SERVER_HOST: ${WEBSITE_SERVER_HOST}
    environment:
        BASE_HOST: ${WEBSITE_BASE_HOST}
        ADMIN_HOST: ${WEBSITE_ADMIN_HOST}
        SERVER_HOST: http://server:8080
        NEXT_PUBLIC_SERVER_HOST: ${WEBSITE_SERVER_HOST}
    ports:
      - "3000:3000"
    depends_on:
      - server
      - admin
    networks:
      - fnote-network
networks:
  fnote-network:
    driver: bridge
